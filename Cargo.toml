[workspace]
# The workspace makes it easier to build the proc-macro crate and run its
# integration tests in the test krate.
members = [".", "tests/krate"]

[package]
name = "typed-fields"
version = "0.7.0"
edition = "2024"

description = "A collection of macros that generate newtypes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jdno/typed-fields"

# Rust edition 2024 requires Rust 1.85.0 or newer.
rust-version = "1.85.0"

# Ship only what a consumer of the crate needs. Everything else, such as the
# development environment and the CI configuration, stays in the repository.
include = [
  "CHANGELOG.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "src/**/*.rs",
  "tests/*.rs",
]

[lib]
proc-macro = true

[package.metadata.docs.rs]
all-features = true

[features]
# These features only control which macros this crate exports. They never change
# the code that an existing macro generates, so enabling one anywhere in the
# dependency graph cannot affect another crate that shares this instance.
secret = []
ulid = []
url = []
uuid = []

[dependencies]
proc-macro2 = ">=1.0.63, <2"
quote = ">=1.0.28, <2"
syn = { version = ">=2.0.31, <3", features = ["extra-traits"] }

# The tests consume this crate the way any other crate does, so they declare the
# same dependencies a consumer declares. None of these are needed by the macros.
[dev-dependencies]
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.184", features = ["derive"] }
serde_json = "1.0.85"
ulid = { version = "1.1.3", features = ["serde"] }
url = { version = "2.2.2", features = ["serde"] }
uuid = { version = "1.1.2", features = ["serde"] }
